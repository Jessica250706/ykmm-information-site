server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${xq.datasource.driver-class-name}
    url: jdbc:mysql://${xq.datasource.host}:${xq.datasource.port}/${xq.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xq.datasource.username}
    password: ${xq.datasource.password}
  data:
    redis:
      host: ${xq.redis.host}
      port: ${xq.redis.port}
      database: ${xq.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xq.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      xq:
        mapper: debug
        service: info
        controller: info

xq:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: 5Y2l3K7p9QwXvB1nR8tF6zJ4mC0aH2sL7dP3uE9oI1=
    # 设置jwt过期时间
    admin-ttl: 604800000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: aB3cD4eF5gH6iJ7kL8mN9oP0qR1sT2uV3wX4yZ5aBcD=
    user-ttl: 604800000
    user-token-name: Authorization
  alioss:
    endpoint: ${xq.alioss.endpoint}
    access-key-id: ${xq.alioss.access-key-id}
    access-key-secret: ${xq.alioss.access-key-secret}
    bucket-name: ${xq.alioss.bucket-name}
